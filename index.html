<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grayson's Hub</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #111;
            color: #fff;
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        .bg-text {
            font-family: "Brush Script MT", cursive;
            font-size: 32px;
            color: #333;
            user-select: none;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="bg-text">
        <h1>Grayson's Hub</h1>
        <p>Dashboard Active</p>
    </div>

    <script>
        (function() {
            if (document.getElementById('grayson-hub-tab')) return;

            // 1. Splash Screen
            var s = document.createElement('div');
            s.style = 'position:fixed;top:0;left:0;width:100vw;height:100vh;background:#000;color:#f00;z-index:99999999;display:flex;justify-content:center;align-items:center;font-family:"Brush Script MT",cursive;font-size:48px;font-weight:bold;transition:opacity 0.5s;text-shadow:0 0 10px rgba(255,0,0,0.5);';
            s.innerText = 'graysons hub';
            document.body.appendChild(s);

            setTimeout(function() {
                s.style.opacity = '0';
                setTimeout(function() {
                    s.remove();
                    lh();
                }, 500);
            }, 1500);

            // 2. Main Widget Construction
            function lh() {
                var d = document.createElement('div');
                d.id = 'grayson-hub-tab';
                d.style = 'position:fixed;top:15px;right:15px;background:rgba(25,25,25,0.95);color:#fff;z-index:9999999;padding:12px 16px;border-radius:12px;box-shadow:0 8px 32px #000;font-family:sans-serif;width:260px;backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,0.1);user-select:none;';

                var h = document.createElement('div');
                h.style = 'display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;cursor:move;';

                var t = document.createElement('span');
                t.innerText = 'graysons hub';
                t.style = 'font-family:"Brush Script MT",cursive;font-size:24px;background:linear-gradient(45deg,#f20,#f55);-webkit-background-clip:text;-webkit-text-fill-color:transparent;pointer-events:none;';

                var x = document.createElement('button');
                x.innerText = '✕';
                x.style = 'background:none;border:none;color:#aaa;cursor:pointer;';
                x.onclick = function() { d.remove(); };

                h.appendChild(t);
                h.appendChild(x);
                d.appendChild(h);

                // Inspect Element Toggle
                var b = document.createElement('button');
                b.innerText = '🔍 Toggle Inspect Element';
                b.style = 'width:100%;padding:8px;margin-bottom:12px;background:#333;color:#fff;border:1px solid #444;border-radius:6px;cursor:pointer;font-weight:bold;';
                
                var st = null;
                b.onclick = function() {
                    if (st) {
                        st.remove();
                        st = null;
                        document.removeEventListener("click", oC, true);
                        b.style.background = "#333";
                    } else {
                        st = document.createElement("style");
                        st.innerHTML = "*:hover{outline:2px dashed #f33!important;cursor:crosshair!important;}";
                        document.head.appendChild(st);
                        document.addEventListener("click", oC, true);
                        b.style.background = "#f20";
                    }
                };

                function oC(e) {
                    e.preventDefault();
                    e.stopPropagation();
                    e.target.setAttribute("contenteditable", "true");
                    e.target.focus();
                    if (st) {
                        st.remove();
                        st = null;
                        document.removeEventListener("click", oC, true);
                        b.style.background = "#333";
                    }
                }

                // Proxy Buttons Section
                var p = document.createElement('div');
                p.style = 'margin-top:8px;border-top:1px solid #333;padding-top:8px;display:flex;flex-direction:column;gap:6px;';
                
                var ln = [
                    {n: '🚀 Cat4z Proxy', b: 'aHR0cHM6Ly9zMy5hbWF6b25hd3MuY29tL2NhdDR6L2luZGV4Lmh0bWw='},
                    {n: '📚 Scholarnook', b: 'aHR0cHM6Ly9zMy5hbWF6b25hd3MuY29tL3NjaG9sYXJub29rL2luZGV4Lmh0bWw='}
                ];

                ln.forEach(function(l) {
                    var btn = document.createElement('button');
                    btn.innerText = l.n;
                    btn.style = 'display:block;padding:8px;background:#222;color:#f33;border:1px solid #444;border-radius:6px;font-size:13px;font-weight:bold;cursor:pointer;';
                    btn.onclick = function() { window.open(atob(l.b), '_blank'); };
                    p.appendChild(btn);
                });

                d.appendChild(b);
                d.appendChild(p);
                document.body.appendChild(d);

                // Touch & Drag Functionality
                var oX = 0, oY = 0, mX = 0, mY = 0;
                h.onmousedown = dragStart;
                h.ontouchstart = dragStart;

                function dragStart(e) {
                    e = e || window.event;
                    e.preventDefault();
                    if (e.type === 'touchstart') {
                        mX = e.touches[0].clientX;
                        mY = e.touches[0].clientY;
                    } else {
                        mX = e.clientX;
                        mY = e.clientY;
                    }
                    document.onmouseup = dragEnd;
                    document.onmousemove = dragMove;
                    document.ontouchend = dragEnd;
                    document.ontouchmove = dragMove;
                }

                function dragMove(e) {
                    e = e || window.event;
                    e.preventDefault();
                    if (e.type === 'touchmove') {
                        oX = mX - e.touches[0].clientX;
                        oY = mY - e.touches[0].clientY;
                        mX = e.touches[0].clientX;
                        mY = e.touches[0].clientY;
                    } else {
                        oX = mX - e.clientX;
                        oY = mY - e.clientY;
                        mX = e.clientX;
                        mY = e.clientY;
                    }
                    d.style.top = (d.offsetTop - oY) + 'px';
                    d.style.right = (parseInt(window.getComputedStyle(d).right) + oX) + 'px';
                }

                function dragEnd() {
                    document.onmouseup = null;
                    document.onmousemove = null;
                    document.ontouchend = null;
                    document.ontouchmove = null;
                }
            }
        })();
    </script>
</body>
</html>
